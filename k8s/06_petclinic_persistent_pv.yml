apiVersion: v1
kind: PersistentVolume
metadata:
  name: petclinic-db-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: petclinic-storage
  hostPath:
    path: /data/postgres            # <-- FIXED: Universal internal path that always exists
