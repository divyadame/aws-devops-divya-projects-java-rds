name: Build and push petclinc to ECR
on:
  push:
    branches: 
      - main
      - production
      - master  
      - 'releases/v*' 

env:
  Docker_hub: divyamd450/petclinic
  AWS_REGION: "ap-south-1" 
  ECR_REPOSITORY: "your-ecr-repo-name" 
  SONAR_HOST_URL: "http://localhost:9000" 
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_PROJECT_KEY: "petclinic_local" 
  SONAR_CNES_URL: "https://github.com"

jobs:
  # 🟢 LAYER 1: Parallel Unit Testing Job
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17 with Native Maven Caching
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # Automatically network-caches ~/.m2/repository

      # Using -T 1C allows Maven to utilize multiple CPU cores on the cloud runner
      - name: Run Unit Tests
        run: ./mvnw test -T 1C

  # 🟢 LAYER 2: Parallel Integration Testing Job (Runs at the same time as Unit Tests)
  integration-tests:
    runs-on: ubuntu-latest
    services: 
      redis:
        image: redis:latest
        ports:
          - 6379:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17 with Native Maven Caching
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Integration Tests
        run: ./mvnw failsafe:integration-test -T 1C

  # 🟢 LAYER 3: Core Compilation, Packaging, and Sonar Upload
  sonar-and-package:
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup JDK 17 with Native Maven Caching
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Network cache configuration to preserve Sonar Analysis states across different cloud VMs
      - name: Cache SonarQube Scanner Data
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ github.sha }}
          restore-keys: ${{ runner.os }}-sonar-

      - name: Sonar Analysis and Packaging
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw clean package sonar:sonar -DskipTests -T 1C \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.scanner.createReportTask=true 

      - name: Generate Sonar CNES Report
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }} 
        run: |
          mkdir reports
          curl -sL ${{ env.SONAR_CNES_URL }} -o sonar-cnes-report.jar
          java -jar sonar-cnes-report.jar -o reports -p "$SONAR_PROJECT_KEY" -h "$SONAR_HOST_URL" -t "$SONAR_TOKEN"

      # Since cloud environments are separate, we use Actions Artifacts to pass the built JAR securely to the next job
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: petclinic.jar
          path: target/*.jar

      - name: Upload Sonar CNES Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonar-cnes-report
          path: reports/*

  # 🟢 LAYER 4: Cloud-Optimized Container Build & Push
  build-and-publish:    
    needs: sonar-and-package 
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      full_image_uri: ${{ steps.get_tag.outputs.uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: petclinic.jar
          path: target/

      # SECURITY OPTIMIZATION: Gain secure authentication access tokens directly from AWS Identity systems
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine tag and construct URI references
        id: get_tag
        run: |
          # Dynamically builds your ECR target endpoints inside AWS
          registry_uri="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          if [ "${{ github.ref_name }}" = "master" ]; then
            tag=dev 
          elif [ "${{ github.ref_name }}" = "production" ]; then
            tag=prod
          else
            tag=${{ github.ref_name }}-${{ github.sha }}
          fi
          echo "uri=$registry_uri:$tag" >> $GITHUB_OUTPUT
          echo "cache_uri=$registry_uri:cache" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # DOCKER CACHING OPTIMIZATION: Switched to type=registry. 
      # This pushes your build cache layers directly into AWS ECR, eliminating the need for local files or manual folder swapping.
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.get_tag.outputs.uri }}
          cache-from: type=registry,ref=${{ steps.get_tag.outputs.cache_uri }}
          cache-to: type=registry,ref=${{ steps.get_tag.outputs.cache_uri }},mode=max

      # SECURITY OPTIMIZATION: Network-caches the Trivy scan engine vulnerability definition database
      - name: Cache Trivy Vulnerability Database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-trivy-

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.get_tag.outputs.uri }}
          format: 'table'
          exit-code: '1' # Blocks the build and fails the pipeline if CRITICAL vulnerabilities are found
          vuln-type: 'os,library'
          severity: 'CRITICAL'

  # 🟢 LAYER 5: Cloud Deployment Execution Block
  deploy:
    needs: build-and-publish 
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev-docker]
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout repo configuration
        uses: actions/checkout@v4

      - name: Configure AWS Credentials for Cluster Access
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # SECURITY OPTIMIZATION: Dynamically pulls temporary Kubernetes authorization keys via AWS CLI.
      # No static kubeconfig files are left exposed inside your code repository.
      - name: Update Kubeconfig for Amazon EKS Cluster
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name your-eks-cluster-name

      - name: Substitute Image placeholder and deploy k8s manifests
        env:
          image_uri: ${{ needs.build-and-publish.outputs.full_image_uri }} 
        run: |
          cd k8s
          sed -i "s|IMAGE_PLACE_HOLDER|$image_uri|g" 01_petclinic_fe_deployment.yml
          kubectl apply -f .
