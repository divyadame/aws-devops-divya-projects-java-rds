name: Build and push petclinc to ECR
on:
  push:
    branches: [ main ]
permissions:
  id-token: write
  contents: write
env:
  Docker_hub: divyamd450/petclinic
  AWS_REGION: "ap-south-1" # Replace with your actual region
  ECR_REPOSITORY: "your-ecr-repo-name" # Replace with your actual ECR repo name

jobs:
  #Step1 Compile and test
  build-and-test:
    runs-on: ubuntu-latest
    services: 
      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' #To cache m2 dependencies

      - name: compile ans test with maven #Code Coverage with Jacoo
        run: ./mvnw clean verify -Pjacco

      - name: upload jar artifact
        uses: actions/upload-artifact@v4
        with: 
          name: petclinic.jar
          path: target/*.jar
          retention-days: 1 #Expires in a day

      - name: upload jacoco Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 1

      # - name: configure aws creds via OIDC
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }} # Replace with your secret or role ARN
      #     aws-region: ${{ env.AWS_REGION }}

      # - name: Login to ECR
      #   id: login-ecr
      #   uses: aws-actions/amazon-ecr-login@v2

      - name: Image tags
        id: vars
        run: |
          SHA_TAG=sha_${GITHUB_SHA:0:7}
          IMAGE_BASE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          echo "IMAGE_BASE=$IMAGE_BASE" >> $GITHUB_ENV
          echo "SHA_TAG=$SHA_TAG" >> $GITHUB_ENV

      - name: build and push iamge
        run: |
          IMAGE_URI="$IMAGE_BASE:$SHA_TAG"
          echo "building docker image with $SHA_TAG"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
      
      - name: setup git to change kube manifest URI
        run: |
          git config --global user.name "ci-bot"
          git config --global user.email "ci-bot@example.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}.git
  
  #Step2 Docker build and push
  container-publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Download jar Artifact
        uses: actions/download-artifact@v4
        with:
          name: petclinic.jar
          path: target/
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: determine tag
        id: get_tag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "tag=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "production" ]; then
            echo "tag=prodlatest" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi
      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.Docker_hub }}:${{ steps.get_tag.outputs.tag }}
