name: Build and push petclinc to ECR
on:
  push:
    branches: [ main ]
permissions:
  id-token: write
  contents: write
env:
  Docker_hub: divyamd450/petclinic
  AWS_REGION: "ap-south-1" # Replace with your actual region
  ECR_REPOSITORY: "your-ecr-repo-name" # Replace with your actual ECR repo name

jobs:
  #Step1 Compile and test
  build-and-test:
    runs-on: self-hosted
    timeout-minutes: 15
    services: 
      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' #To cache m2 dependencies

      - name: compile ans test with maven #Code Coverage with Jacoo
        run: ./mvnw clean verify -Pjacco
      - name: Add Jacoco report to PR /Job summary
        uses: madrapps/jacoco-report@v1.7.1
        if : always() # Ensures report runs even if tests fail
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-covergae-default: 90
          title: "JaCoCo Code Coverage Report"
          update-comment: true

      - name: upload jar artifact
        uses: actions/upload-artifact@v4
        with: 
          name: petclinic.jar
          path: target/*.jar
          retention-days: 1 #Expires in a day

      - name: upload jacoco Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 1
      - name: Build,Test and Sonar analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw clean verify sonar:sonar -Dsonar.host.url=http://localhost:9000 -Dsonar.token=${{ secrets.SONAR_TOKEN }} -Dsonar.projectKey=petclinic_local -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml -Dsonar.scanner.createReportTask=true 
         # Forces creation of the local metadata file
      - name: Sonarqube qulity gate check
        id: sonarqube-quality-gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        with:
          scanMetadataReportFile: target/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://127.0.0.1:9000
          SONAR_ProjectKey: petclinic_local
      # - name: configure aws creds via OIDC
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }} # Replace with your secret or role ARN
      #     aws-region: ${{ env.AWS_REGION }}

      # - name: Login to ECR
