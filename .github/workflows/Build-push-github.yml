name: Build and push petclinc to ECR
on:
  push:
    branches: 
      - main
      - production
      - master  
      - 'releases/v*' 

env:
  Docker_hub: divyamd450/petclinic
  AWS_REGION: "ap-south-1" 
  ECR_REPOSITORY: "your-ecr-repo-name" 
  SONAR_HOST_URL: "http://localhost:9000" 
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_PROJECT_KEY: "petclinic_local" 
  cache_dir: "/home/divya/devops_handson/spring-petclinic"
  SONAR_CNES_URL: "https://github.com/cnescatlab/sonar-cnes-report/releases/download/4.1.1/sonar-cnes-report-4.1.1.jar"

jobs:
  # 🟢 SPEED OPTIMIZATION: Runs Unit Tests using multi-threaded core compilation
  unit-tests:
    runs-on: self-hosted
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Added -T 1C flag for multi-threaded CPU parallel compilation
      - name: Run Unit Tests
        run: |
          ./mvnw test -T 1C -Dmaven.repo.local=${{ env.cache_dir }}/.m2/repository

  # 🟢 SPEED OPTIMIZATION: Runs Integration Tests concurrently using multi-threading
  integration-tests:
    runs-on: self-hosted
    services: 
      redis:
        image: redis:latest
        ports:
          - 6379:6379
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Integration Tests
        run: |
          ./mvnw failsafe:integration-test -T 1C -Dmaven.repo.local=${{ env.cache_dir }}/.m2/repository

  # 🟢 SPEED OPTIMIZATION: Packages application and updates Sonar Metrics
  sonar-and-package:
    needs: [unit-tests, integration-tests]
    runs-on: self-hosted
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Sonar Analysis and Packaging
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw clean package sonar:sonar -DskipTests -T 1C \
            -Dmaven.repo.local=${{ env.cache_dir }}/.m2/repository \
            -Dsonar.userHome=${{ env.cache_dir }} \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.scanner.createReportTask=true 
         
      # SPEED OPTIMIZATION: Instead of uploading a large JAR over the internet, copy it locally on the runner
      - name: Copy JAR to Host Storage Local Cache
        run: |
          mkdir -p ${{ env.cache_dir }}/shared-artifacts
          cp target/*.jar ${{ env.cache_dir }}/shared-artifacts/petclinic.jar

      - name: Sonarqube quality gate check
        id: sonarqube-quality-gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        with:
          scanMetadataReportFile: target/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL:  ${{ env.SONAR_HOST_URL }}
          SONAR_ProjectKey: ${{ env.SONAR_PROJECT_KEY }}

      - name: Generate sonar CNES report
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }} 
        run: |
          mkdir ${{ env.cache_dir }}/reports
          cd ${{ env.cache_dir }}/reports
          curl -sL ${{ env.SONAR_CNES_URL }} -o sonar-cnes-report.jar
          java -jar ${{ env.cache_dir }}/reports/sonar-cnes-report.jar -o reports -p "$SONAR_PROJECT_KEY" -h "$SONAR_HOST_URL" -t "$SONAR_TOKEN"

  # 🟢 SPEED & SECURITY OPTIMIZATION: Compiles image utilizing local disk dependencies
  build-and-publish:    
    needs: sonar-and-package 
    runs-on: self-hosted
    timeout-minutes: 30
    outputs:
      full_image_uri: ${{ steps.get_tag.outputs.uri }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      # SPEED OPTIMIZATION: Pull the JAR instantly from local disk storage in 0 seconds
      - name: Fetch JAR from Host Storage Local Cache
        run: |
          mkdir -p target
          cp ${{ env.cache_dir }}/shared-artifacts/petclinic.jar target/spring-petclinic.jar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: determine tag and construct URI
        id: get_tag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            tag=dev 
          elif [ "${{ github.ref_name }}" = "production" ]; then
            tag=prod
          else
            tag=${{ github.ref_name }}-${{ github.sha }}
          fi
          echo "uri=${{ env.Docker_hub }}:$tag" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.get_tag.outputs.uri }}
          cache-from: type=local,src=${{ env.cache_dir }}/docker-cache
          cache-to: type=local,dest=${{ env.cache_dir }}/docker-cache-new,mode=max

      - name: Move Docker Cache Layers
        run: |
          rm -rf ${{ env.cache_dir }}/docker-cache
          mv ${{ env.cache_dir }}/docker-cache-new ${{ env.cache_dir }}/docker-cache

      # SECURITY OPTIMIZATION: Configured Trivy to use a persistent cache directory on disk
      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.get_tag.outputs.uri }}
          format: 'table'
          exit-code: '1' # SECURITY UPGRADE: Fails the pipeline build if CRITICAL vulnerabilities are found
          vuln-type: 'os,library'
          severity: 'CRITICAL'
          cache-dir: ${{ env.cache_dir }}/.trivy-cache

  # 🟢 SECURITY OPTIMIZATION: Deploy via a Secure Token Payload configuration
  deploy:
    needs: build-and-publish 
    runs-on: self-hosted
    strategy:
      matrix:
        environment: [dev-docker]
    environment: ${{ matrix.environment }}
    steps:
      - name: checkout repo config
        uses: actions/checkout@v4

      # SECURITY UPGRADE: Safely extracts a restricted cluster authorization token instead of exposing host files
      - name: Authenticate and Verify Kubernetes Cluster
        run: |
          echo "${{ secrets.KUBERNETES_CLUSTER_CREDENTIALS }}" > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml
          kubectl cluster-info

      - name: Substitute Image placeholder and deploy k8s manifests
        env:
          image_uri: ${{ needs.build-and-publish.outputs.full_image_uri }} 
        run: |
          export KUBECONFIG=kubeconfig.yaml
          cd k8s
          sed -i "s|IMAGE_PLACE_HOLDER|$image_uri|g" 01_petclinic_fe_deployment.yml
          kubectl apply -f .
          rm kubeconfig.yaml # Immediately scrub credentials from memory disk storage once deployment wraps
