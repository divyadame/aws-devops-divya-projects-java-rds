name: Build and push petclinc to ECR
on:
  push:
    branches: [ main ]
permissions:
  id-token: write
  contents: write
env:
  Docker_hub: divyamd450/petclinic
  AWS_REGION: "ap-south-1" # Replace with your actual region
  ECR_REPOSITORY: "your-ecr-repo-name" # Replace with your actual ECR repo name

jobs:
  #Step1 Compile and test
  build-and-test:
    runs-on: self-hosted
    timeout-minutes: 15
    services: 
      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' #To cache m2 dependencies

      - name: compile ans test with maven #Code Coverage with Jacoo
        run: ./mvnw clean verify -Pjacco
      - name: Add Jacoco report to PR /Job summary
        uses: madrapps/jacoco-report@v1.7.1
        if : always() # Ensures report runs even if tests fail
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-covergae-default: 90
          title: "JaCoCo Code Coverage Report"
          update-comment: true

      - name: upload jar artifact
        uses: actions/upload-artifact@v4
        with: 
          name: petclinic.jar
          path: target/*.jar
          retention-days: 1 #Expires in a day

      - name: upload jacoco Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 1
      - name: Build,Test and Sonar analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw clean verify sonar:sonar -Dsonar.host.url=http://localhost:9000 -Dsonar.token=${{ secrets.SONAR_TOKEN }} -Dsonar.projectKey=petclinic_local -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml -Dsonar.scanner.createReportTask=true 
         # Forces creation of the local metadata file
      - name: Sonarqube qulity gate check
        id: sonarqube-quality-gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        with:
          scanMetadataReportFile: target/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://127.0.0.1:9000
          SONAR_ProjectKey: petclinic_local
 #Docker build and push
  container-publish:
    needs: build-and-test
    runs-on: self-hosted
    timeout-minutes: 15
    outputs:
      full_image_uri: ${{ steps.get_tag.outputs.uri }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Download jar Artifact
        uses: actions/download-artifact@v4
        with:
          name: petclinic.jar
          path: target/
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: determine tag and construct URI
        id: get_tag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
           tag=dev 
          elif [ "${{ github.ref_name }}" = "production" ]; then
           tag=prod
          else
           tag=${{ github.ref_name }}-${{ github.sha }}
          fi
          # build the image URI and pass it github actions memory
          echo "uri=${{ env.Docker_hub }}:$tag" >> $GITHUB_OUTPUT
          echo "tag=$tag" >> $GITHUB_OUTPUT
      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.get_tag.outputs.uri }}
  #Step3: Deploy
  deploy:
    needs: container-publish
    runs-on: self-hosted
    strategy:
      matrix:
        environment: [dev-docker]
    environment: ${{ matrix.environment }}
    steps:
      - name: checkout repo config
        uses: actions/checkout@v4

      - name: verify environment
        env: 
          KUBECONFIG: /home/divya/.kube/config
        run: |
         echo "running inside my WSL"
         docker version
         kubectl cluster-info
      - name: Substitue Image placeholder and deploy k8s manifests
        env:
          image_uri: ${{ needs.container-publish.outputs.full_image_uri }}
          KUBECONFIG: /home/divya/.kube/config
        run: |
         cd k8s
         sed -i "s|IMAGE_PLACE_HOLDER|$image_uri|g" 01_petclinic_fe_deployment.yml
         kubectl apply -f .


        

