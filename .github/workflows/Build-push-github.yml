name: Build and push petclinc to ECR
on:
  push:
    branches: 
      - main
      - production
      - master  
      - releases/v*.
    tags:
      - 'v*.*.*'
  pull_request:
    types: [opened, synchronize, reopened]
env:
  Docker_hub: divyamd450/petclinic
  AWS_REGION: "ap-south-1" # Replace with your actual region
  ECR_REPOSITORY: "your-ecr-repo-name" # Replace with your actual ECR repo name
  SONAR_HOST_URL: "http://localhost:9000" # Replace with your SonarQube server URL
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_PROJECT_KEY: "petclinic_local" # Replace with your SonarQube project key

jobs: 
  #Step1 Compile and test
  build-and-test:
    runs-on: self-hosted
    timeout-minutes: 15
    services: 
      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for accurate SonarQube analysis

      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' #To cache m2 dependencies
      - name: cache SonarQube Scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build,Test, scan dependencies and Sonar analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw clean verify org.owasp:dependency-check-maven:check sonar:sonar -Dsonar.host.url=${{ env.SONAR_HOST_URL }} -Dsonar.token=${{ secrets.SONAR_TOKEN }} -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml -Dsonar.dependencyCheck.xmlReportPath=target/dependency-check/dependency-check-report.xml -Dsonar.scanner.createReportTask=true 
         
      - name: Sonarqube qulity gate check
        id: sonarqube-quality-gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        with:
          scanMetadataReportFile: target/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL:  ${{ env.SONAR_HOST_URL }}
          SONAR_ProjectKey: ${{ env.SONAR_PROJECT_KEY }}

      - name: Generate sonar CNES report
        if: steps.sonarqube-quality-gate.outputs.quality-gate-status == 'ERROR'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://127.0.0.1:9000  
          run: |
           mkdir reports
           curl -sL https://github.com -o sonar-cnes-report.jar
           java -jar sonar-cnes-report.jar -o reports -p "$SONAR_PROJECT_KEY" -h "$SONAR_HOST_URL" -t "$SONAR_TOKEN"
           ls -l reports  

build-and-publish:    
  runs-on: self-hosted
  timeout-minutes: 15
  outputs:
    full_image_uri: ${{ steps.get_tag.outputs.uri }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Download jar Artifact
        uses: actions/download-artifact@v4
        with:
          name: petclinic.jar
          path: target/
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: determine tag and construct URI
        id: get_tag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
           tag=dev 
          elif [ "${{ github.ref_name }}" = "production" ]; then
           tag=prod
          else
           tag=${{ github.ref_name }}-${{ github.sha }}
          fi
          # build the image URI and pass it github actions memory
          echo "uri=${{ env.Docker_hub }}:$tag" >> $GITHUB_OUTPUT
          echo "tag=$tag" >> $GITHUB_OUTPUT
      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.get_tag.outputs.uri }}
      - name: scan image with trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.get_tag.outputs.uri }}
          format: 'table'
          exit-code: '0' # 1 for Fails the pipeline if severe vulnerabilities are found
          vuln-type: 'os,library'
          severity: 'CRITICAL'
  #Step3: Deploy
  deploy:
    needs: container-publish
    runs-on: self-hosted
    strategy:
      matrix:
        environment: [dev-docker]
    environment: ${{ matrix.environment }}
    steps:
      - name: checkout repo config
        uses: actions/checkout@v4

      - name: verify environment
        env: 
          KUBECONFIG: /home/divya/.kube/config
        run: |
         echo "running inside my WSL"
         docker version
         kubectl cluster-info
      - name: Substitue Image placeholder and deploy k8s manifests
        env:
          image_uri: ${{ needs.container-publish.outputs.full_image_uri }}
          KUBECONFIG: /home/divya/.kube/config
        run: |
         cd k8s
         sed -i "s|IMAGE_PLACE_HOLDER|$image_uri|g" 01_petclinic_fe_deployment.yml
         kubectl  apply -f .


        

