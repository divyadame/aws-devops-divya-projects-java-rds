name: Build and push petclinic to AWS ECR and EKS
on:
  push:
    branches: 
      - main
      - production
      - master  
      - 'releases/v*' 
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/build-push-deploy-aws.yml'

# Required to request temporary security credentials from AWS via OIDC
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "ap-south-1" 
  AWS_ROLE_ARN: "arn:aws:iam::123456789012:role/github-actions-eks-role" # Replace with your IAM Role ARN
  ECR_REPOSITORY: "petclinic"                       # Replace with your ECR Repository Name
  EKS_CLUSTER_NAME: "my-eks-cluster"                # Replace with your EKS Cluster Name
  SONAR_HOST_URL: "http://localhost:9000" 
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_PROJECT_KEY: "petclinic_local" 
  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
  EKS_CLUSTER_NAME: "my-eks-cluster"                # Replace with your EKS Cluster Name
  


jobs: 
  # ==========================================
  # STEP 1: COMPILE, TEST, AND QUALITY CHECKS
  # ==========================================
  build-and-test:
    runs-on: self-hosted
    timeout-minutes: 15
    services: 
      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' 

      - name: cache SonarQube Scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, Test, scan dependencies and Sonar analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw clean verify org.owasp:dependency-check-maven:check sonar:sonar \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.dependencyCheck.xmlReportPath=target/dependency-check/dependency-check-report.xml \
            -Dsonar.scanner.createReportTask=true 
         
      - name: Sonarqube quality gate check
        id: sonarqube-quality-gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        with:
          scanMetadataReportFile: target/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
          SONAR_ProjectKey: ${{ env.SONAR_PROJECT_KEY }}

      - name: Generate sonar CNES report
        if: steps.sonarqube-quality-gate.outputs.quality-gate-status == 'ERROR'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://127.0.0.1:9000  
        run: |
          mkdir reports
          curl -sL https://github.com -o sonar-cnes-report.jar
          java -jar sonar-cnes-report.jar -o reports -p "$SONAR_PROJECT_KEY" -h "$SONAR_HOST_URL" -t "$SONAR_TOKEN"
          ls -l reports  

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: petclinic.jar
          path: target/*.jar

  # ==========================================
  # STEP 2: BUILD AND PUBLISH TO AMAZON ECR
  # ==========================================
  build-and-publish:    
    needs: build-and-test 
    runs-on: self-hosted
    timeout-minutes: 15
    outputs:
      full_image_uri: ${{ steps.build-image.outputs.image }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Download jar Artifact
        uses: actions/download-artifact@v4
        with:
          name: petclinic.jar
          path: target/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: ://amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: determine tag and construct URI
        id: get_tag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            tag=dev 
          elif [ "${{ github.ref_name }}" = "production" ]; then
            tag=prod
          else
            tag=${{ github.ref_name }}-${{ github.sha }}
          fi
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: scan image with trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build-image.outputs.image }}
          format: 'table'
          exit-code: '0' 
          vuln-type: 'os,library'
          severity: 'CRITICAL'

  # ==========================================
  # STEP 3: DEPLOY TO AWS EKS CLUSTER
  # ==========================================
  deploy:
    needs: build-and-publish 
    runs-on: self-hosted
    strategy:
      matrix:
        environment: [dev-docker, aws_eks]
    environment: ${{ matrix.environment }}
    steps:
      - name: checkout repo config
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: ://amazonaws.com

      - name: Update KubeConfig from AWS EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Substitute Image placeholder and deploy k8s manifests
        env:
          image_uri: ${{ needs.build-and-publish.outputs.full_image_uri }} 
        run: |
          cd k8s
          sed -i "s|IMAGE_PLACE_HOLDER|$image_uri|g" 01_petclinic_fe_deployment.yml
          kubectl apply -f .
