name: Build and push petclinc to ECR
on:
  push:
    branches: [ main ]
permissions:
  id-token: write
  contents: write
env:
  Docker_hub: divyamd450/petclinic
  AWS_REGION: "ap-south-1" # Replace with your actual region
  ECR_REPOSITORY: "your-ecr-repo-name" # Replace with your actual ECR repo name

jobs:
  # Step 1: Compile, Test, and Quality Checks
  build-and-test:
    runs-on: self-hosted
    timeout-minutes: 15
    services: 
      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Crucial: SonarQube needs git blame history to track bugs

      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Combined compilation, testing, JaCoCo, and SonarQube scan into ONE single pass.
      # Replaced 'localhost' with '127.0.0.1' to prevent IPv6 routing errors inside WSL.
      - name: Build, Test, and SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw clean verify sonar:sonar -Pjacoco -Dsonar.host.url=http://127.0.0.1:9000 -Dsonar.token=${{ secrets.SONAR_TOKEN }} -Dsonar.projectKey=petclinic_local -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml -Dsonar.scanner.createReportTask=true

      # Fixed typo 'min-covergae-default' and switched to the valid 'min-coverage-overall' input.
      - name: Add Jacoco report to PR / Job summary
        uses: madrapps/jacoco-report@v1.7.1
        if: always()
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 90
          title: "JaCoCo Code Coverage Report"
          update-comment: true

      - name: upload jar artifact
        uses: actions/upload-artifact@v4
        with: 
          name: petclinic.jar
          path: target/*.jar
          retention-days: 1

      - name: upload jacoco Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 1

      # Synchronizes with local container to verify if quality thresholds passed.
      - name: Sonarqube quality gate check
        id: sonarqube-quality-gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        with:
          scanMetadataReportFile: target/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://127.0.0.1:9000

  # Step 2: Docker build and push
  container-publish:
    needs: build-and-test
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Download jar Artifact
        uses: actions/download-artifact@v4
        with:
          name: petclinic.jar
          path: target/
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: determine tag
        id: get_tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "master" ]; then
            echo "tag=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "production" ]; then
            echo "tag=prodlatest" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi
      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.Docker_hub }}:${{ steps.get_tag.outputs.tag }}
